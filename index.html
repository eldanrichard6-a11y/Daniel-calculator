<!DOCTYPE html>
<html>
<head>
  <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Coins Collector</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; background: #444; margin: auto; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; pointer-events: none; }
        .score-box { font-size: 24px; font-weight: bold; color: #ffd700; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">COINS: <span id="coinCount">0</span></div>
        <small>Swipe Kushoto/Kulia kukusanya Coins!</small>
    </div>
    <canvas id="subwayCanvas"></canvas>

    <script>
        const canvas = document.getElementById("subwayCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const laneWidth = canvas.width / 3;
        let coins = 0;
        let gameActive = true;
        let speed = 8;

        let player = { lane: 1, y: canvas.height - 120, w: 50, h: 80, color: "#00f2ff" };
        let objects = []; // Hapa tutaweka Treni na Coins

        // Kazi ya kutengeneza Kitu (Treni au Coin)
        function spawnObject() {
            let lane = Math.floor(Math.random() * 3);
            let isCoin = Math.random() > 0.4; // 60% nafasi ya kuwa Coin

            objects.push({
                lane: lane,
                x: lane * laneWidth + (laneWidth/2 - 15),
                y: -100,
                w: isCoin ? 30 : 60,
                h: isCoin ? 30 : 120,
                type: isCoin ? "coin" : "train",
                color: isCoin ? "#ffd700" : "#ff4757"
            });
        }

        // Swipe Logic kwa Honor X6b yako
        let touchStartX = 0;
        window.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
        window.addEventListener('touchend', e => {
            let dir = e.changedTouches[0].clientX - touchStartX;
            if (dir < -50 && player.lane > 0) player.lane--; 
            if (dir > 50 && player.lane < 2) player.lane++;
        });

        function loop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Chora Barabara
            ctx.strokeStyle = "#666";
            for(let i=1; i<3; i++) {
                ctx.beginPath(); ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height); ctx.stroke();
            }

            // Chora Mchezaji
            let targetX = player.lane * laneWidth + (laneWidth/2 - player.w/2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15; ctx.shadowColor = player.color;
            ctx.fillRect(targetX, player.y, player.w, player.h);
            ctx.shadowBlur = 0;

            // Tengeneza vitu vipya
            if (Math.random() < 0.03) spawnObject();

            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.y += speed;

                // Chora Kitu
                ctx.fillStyle = obj.color;
                if(obj.type === "coin") {
                    ctx.beginPath(); ctx.arc(obj.x + 15, obj.y + 15, 15, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillRect(obj.lane * laneWidth + (laneWidth/2 - 30), obj.y, 60, 120);
                }

                // Kagua Migongano (Collision)
                let pX = player.lane * laneWidth + (laneWidth/2 - player.w/2);
                if (pX < (obj.lane * laneWidth + laneWidth) && pX + player.w > (obj.lane * laneWidth) &&
                    player.y < obj.y + obj.h && player.y + player.h > obj.y) {
                    
                    if(obj.type === "coin") {
                        coins++;
                        document.getElementById("coinCount").innerText = coins;
                        objects.splice(i, 1); // Ondoa coin baada ya kuigusa
                    } else {
                        gameActive = false;
                        alert("UMEGONGA TRENI! Coins Ulizopata: " + coins);
                        location.reload(); // Anza upya
                    }
                }

                if (obj.y > canvas.height) objects.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
