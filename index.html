<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Scientific Calc</title>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <style>
        /* CSS - Muonekano (Zile kodi za urembo nilizokupa awali) */
        :root {
            --bg-color: #0f172a;
            --calc-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: var(--calc-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .screen {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        #history-display {
            font-size: 14px;
            color: var(--accent);
            min-height: 20px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        #main-display {
            font-size: 32px;
            border: none;
            background: transparent;
            color: white;
            width: 100%;
            text-align: right;
            outline: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        button:active { transform: scale(0.95); }

        .btn-sci { background: rgba(56, 189, 248, 0.1); color: var(--accent); font-size: 13px; }
        .btn-op { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .btn-clear { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn-equal { 
            background: var(--accent); 
            color: var(--bg-color); 
            grid-column: span 2;
            font-size: 24px;
        }

        .history-panel {
            margin-top: 20px;
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="screen">
        <div id="history-display"></div>
        <input type="text" id="main-display" placeholder="0" readonly>
    </div>

    <div class="grid">
        <button class="btn-sci" onclick="push('Math.sin(')">sin</button>
        <button class="btn-sci" onclick="push('Math.cos(')">cos</button>
        <button class="btn-sci" onclick="push('Math.tan(')">tan</button>
        <button class="btn-sci" onclick="push('Math.log10(')">log</button>
        <button class="btn-clear" onclick="clearAll()">AC</button>

        <button class="btn-sci" onclick="push('Math.pow(')">xʸ</button>
        <button class="btn-sci" onclick="push('Math.sqrt(')">√</button>
        <button class="btn-sci" onclick="push('Math.PI')">π</button>
        <button class="btn-sci" onclick="push('Math.E')">e</button>
        <button class="btn-clear" onclick="back()">DEL</button>

        <button onclick="push('7')">7</button>
        <button onclick="push('8')">8</button>
        <button onclick="push('9')">9</button>
        <button class="btn-op" onclick="push('(')">(</button>
        <button class="btn-op" onclick="push(')')">)</button>

        <button onclick="push('4')">4</button>
        <button onclick="push('5')">5</button>
        <button onclick="push('6')">6</button>
        <button class="btn-op" onclick="push('*')">×</button>
        <button class="btn-op" onclick="push('/')">÷</button>

        <button onclick="push('1')">1</button>
        <button onclick="push('2')">2</button>
        <button onclick="push('3')">3</button>
        <button class="btn-op" onclick="push('+')">+</button>
        <button class="btn-op" onclick="push('-')">−</button>

        <button onclick="push('0')">0</button>
        <button onclick="push('.')">.</button>
        <button onclick="push('Math.exp(')">exp</button>
        <button class="btn-equal" onclick="solve()">=</button>
    </div>

    <div class="history-panel" id="logs">
        <em>History itatokea hapa...</em>
    </div>
</div>

<script>
    // JavaScript Logic (Zile kodi za mahesabu)
    const mainDisp = document.getElementById('main-display');
    const histDisp = document.getElementById('history-display');
    const logs = document.getElementById('logs');

    function push(val) { mainDisp.value += val; }
    function clearAll() { mainDisp.value = ''; histDisp.innerText = ''; }
    function back() { mainDisp.value = mainDisp.value.slice(0, -1); }

    function solve() {
        try {
            let expression = mainDisp.value;
            let openBrackets = (expression.match(/\(/g) || []).length;
            let closeBrackets = (expression.match(/\)/g) || []).length;
            while(openBrackets > closeBrackets) { expression += ')'; closeBrackets++; }

            let result = eval(expression);
            if (result.toString().includes('.')) { result = parseFloat(result.toFixed(8)); }

            histDisp.innerText = mainDisp.value + " =";
            mainDisp.value = result;

            const p = document.createElement('div');
            p.innerText = expression + " = " + result;
            logs.prepend(p);
            if(logs.children.length > 5) logs.lastChild.remove();
        } catch (e) {
            mainDisp.value = "Error";
            setTimeout(() => { mainDisp.value = ''; }, 1500);
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') push(e.key);
        if (e.key === '+') push('+');
        if (e.key === '-') push('-');
        if (e.key === '*') push('*');
        if (e.key === '/') push('/');
        if (e.key === 'Enter') solve();
        if (e.key === 'Backspace') back();
        if (e.key === 'Escape') clearAll();
    });
</script>
</body>
</html>
